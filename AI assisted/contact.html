<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HenriCar - Contact</title>
</head>

<body>
    <header>
        <h1>HenriCar</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact HenriCar</h2>

            <p>
                Have a question about one of our vehicles or services? Send us a
                message and our team will contact you.
            </p>

            <form>
                <div>
                    <label for="firstName">First Name:</label>
                    <input type="text" id="firstName" name="firstName">
                </div>

                <div>
                    <label for="lastName">Last Name:</label>
                    <input type="text" id="lastName" name="lastName">
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div>
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="6"></textarea>
                </div>

                <button type="submit">Send</button>
            </form>
        </section>

        <section>
            <h2>Contact Information</h2>

            <address>
                <p>HenriCar Dealership</p>
                <p>123 Main Avenue, Recife, PE</p>
                <p>Phone: <a href="tel:+558130000000">(81) 3000-0000</a></p>
            </address>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 HenriCar. All rights reserved.</p>
    </footer>
</body>

</html>
